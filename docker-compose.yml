services:
  rag:
    build:
      context: .
    image: rag-document-assistant:latest
    restart: unless-stopped
    # Bound to loopback: terminate TLS in front of it rather than exposing an
    # unauthenticated /ask (it spends API credits) to the internet.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DOCS_DIR: /data/docs
      PERSIST_DIR: /data/chroma
    volumes:
      # Your corpus, read-only — ingestion reads it and writes only to Chroma.
      - ./data/docs:/data/docs:ro
      # The index survives rebuilds; it is expensive to recompute.
      - chroma:/data/chroma
    # Leaves headroom on a 2 GB t3.small for the host and the Docker daemon.
    mem_limit: 1400m

volumes:
  chroma:
