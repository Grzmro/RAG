[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Grounded LLM Q&A over your documents, with citations and a groundedness evaluation loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Core RAG stack
    "langchain>=0.3.27",
    "langchain-core>=0.3.75",
    "langchain-anthropic>=0.3.20",
    "langchain-chroma>=0.2.5",
    "langchain-text-splitters>=0.3.11",
    "chromadb>=1.0.0",
    # Default embedding backend: local ONNX, no extra API key, no torch
    "fastembed>=0.7.0",
    # Document loading
    "pypdf>=5.0.0",
    # Config / CLI / eval
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    # HTTP API (rag serve)
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
# uv sync --extra voyage       (then set EMBEDDING_PROVIDER and/or RERANK_PROVIDER=voyage)
voyage = [
    "langchain-voyageai>=0.1.6",
    "voyageai>=0.3.2",
]
# uv sync --extra huggingface  (then set EMBEDDING_PROVIDER and/or RERANK_PROVIDER=huggingface)
huggingface = [
    "langchain-huggingface>=0.3.0",
    "sentence-transformers>=3.3.0",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]  # httpx backs fastapi's TestClient

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
