[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Grounded LLM Q&A over your documents, with citations and a groundedness evaluation loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Core RAG stack
    "langchain>=0.3.27",
    "langchain-core>=0.3.75",
    "langchain-anthropic>=0.3.20",
    "langchain-chroma>=0.2.5",
    "langchain-text-splitters>=0.3.11",
    "chromadb>=1.0.0",
    # Default embedding backend: local ONNX, no extra API key, no torch
    "fastembed>=0.7.0",
    # Document loading
    "pypdf>=5.0.0",
    # Config / CLI / eval
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    # HTTP API (rag serve)
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
# uv sync --extra voyage       (then set EMBEDDING_PROVIDER and/or RERANK_PROVIDER=voyage)
voyage = [
    "langchain-voyageai>=0.1.6",
    "voyageai>=0.3.2",
]
# uv sync --extra huggingface  (then set EMBEDDING_PROVIDER and/or RERANK_PROVIDER=huggingface)
huggingface = [
    "langchain-huggingface>=0.3.0",
    "sentence-transformers>=3.3.0",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",  # httpx backs fastapi's TestClient
    "ruff>=0.8.0",    # linter and formatter, one tool for both
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# The width the code was already written to; only `demo.py` ever exceeded it.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — keep syntax current with the floor in requires-python
    "B",    # bugbear
    "SIM",  # simplifiable constructs
    "BLE",  # blind except — the code already carries `noqa: BLE001` where one is deliberate
    "SLF",  # private member access — likewise
    "RUF",  # ruff's own checks
]
ignore = [
    # The prose deliberately contains £, en dashes and non-Latin text; that is the
    # point of the Unicode-aware tokenizer, not a typo to normalise away.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a default argument is how FastAPI declares dependencies.
"rag/api.py" = ["B008"]
# Test-class constants are fixtures, not shared mutable state, and unit tests are
# entitled to reach for the internals they are testing.
"tests/*" = ["RUF012", "SLF001"]
